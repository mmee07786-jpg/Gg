<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#000000">
<title>VLX</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#1e1f22;--card:#2b2d31;--tx:#f2f3f5;--mu:#949ba4;--ln:#3f4147;--ac:#4e5058;--ac2:#6d6f78;--ac3:#b5bac1;--sh:0 8px 24px rgba(0,0,0,.18);
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1e1f22;--card:#2b2d31;--tx:#f2f3f5;--mu:#949ba4;--ln:#3f4147;--sh:0 8px 24px rgba(0,0,0,.35)}}
:root[data-theme="dark"]{--bg:#1e1f22;--card:#2b2d31;--tx:#f2f3f5;--mu:#949ba4;--ln:#3f4147;--sh:0 8px 24px rgba(0,0,0,.35)}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:var(--bg);color:var(--tx);font-family:Cairo,Tahoma,"Segoe UI",sans-serif;overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
#app{height:100%;max-width:480px;margin:auto;display:flex;flex-direction:column;position:relative;overflow:hidden}
header{display:flex;align-items:center;justify-content:space-between;padding:10px 16px}
.logo{font-weight:800;font-size:26px;background:linear-gradient(90deg,#3a3a3a,#8b0000);-webkit-background-clip:text;background-clip:text;color:transparent}
.hb{width:38px;height:38px;border-radius:50%;background:var(--card);box-shadow:var(--sh);font-size:17px}
main{flex:1;position:relative;overflow:hidden}
.page{position:absolute;inset:0;overflow-y:auto;padding:4px 14px 90px;opacity:0;pointer-events:none;transform:translateX(calc(var(--in,1)*70px)) scale(.94);filter:blur(8px);transition:transform .55s cubic-bezier(.2,.9,.25,1),opacity .4s,filter .45s}
.page.on{opacity:1;pointer-events:auto;transform:none;filter:none}
.page.out{transform:translateX(calc(var(--in,1)*-70px)) scale(.94)}
.stories{display:flex;gap:12px;overflow-x:auto;padding:6px 2px 14px;scrollbar-width:none}
.st{flex:none;text-align:center;font-size:12px;color:var(--mu);width:66px}
.ring{width:62px;height:62px;border-radius:50%;padding:3px;background:linear-gradient(135deg,#3b82f6,#8b5cf6);margin-bottom:4px}
.ring i{display:grid;place-items:center;width:100%;height:100%;border-radius:50%;background:var(--card);border:3px solid var(--card);font-style:normal;font-size:26px}
.card{background:var(--card);border-radius:24px;box-shadow:var(--sh);margin-bottom:16px;overflow:hidden}
.ph{display:flex;align-items:center;gap:10px;padding:12px 14px}
.av{width:40px;height:40px;border-radius:14px;display:grid;place-items:center;font-size:20px;flex:none}
.ph b{display:block;font-size:15px}.ph small{color:var(--mu);font-size:12px}
.tx{padding:0 14px 12px;line-height:1.7;font-size:15px}
.md{height:230px;display:grid;place-items:center;font-size:84px;position:relative;user-select:none}
.ac{display:flex;gap:6px;padding:8px 10px}
.ac button{padding:8px 12px;border-radius:14px;font-size:14px;color:var(--mu);display:flex;gap:6px;align-items:center;transition:transform .2s}
.ac button:active{transform:scale(.88)}
.ac .liked{color:var(--ac2);font-weight:600}
.row{display:flex;align-items:center;gap:12px;padding:12px;background:var(--card);border-radius:20px;box-shadow:var(--sh);margin-bottom:10px;width:100%;text-align:start}
.row .m{flex:1;min-width:0}.row .m small{color:var(--mu);display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
h2{font-size:18px;margin:6px 2px 10px}
.search{width:100%;padding:12px 16px;border-radius:18px;border:1px solid var(--ln);background:var(--card);color:var(--tx);font:inherit;margin-bottom:12px}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.chip{padding:7px 14px;border-radius:99px;background:var(--card);border:1px solid var(--ln);font-size:13px}
.join{padding:7px 16px;border-radius:14px;background:var(--ac);color:#fff;font-size:13px;transition:.3s}
.cover{height:130px;border-radius:26px;background:linear-gradient(120deg,#3a3c42,#2b2d31)}
.me{text-align:center;margin-top:-44px;position:relative;z-index:2}
.me .av{width:88px;height:88px;border-radius:30px;font-size:44px;margin:auto;border:4px solid var(--bg);background:var(--card)}
.nums{display:flex;justify-content:space-around;margin:14px 0}.nums b{display:block;font-size:20px}.nums small{color:var(--mu)}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.grid div{aspect-ratio:1;border-radius:16px;display:grid;place-items:center;font-size:32px}
nav{position:relative;display:flex;margin:0 12px 10px;padding:6px;background:var(--card);border-radius:26px;box-shadow:var(--sh)}
nav button{flex:1;position:relative;z-index:1;padding:8px 0;font-size:11px;color:var(--mu);display:flex;flex-direction:column;align-items:center;transition:color .3s}
nav button em{font-style:normal;font-size:21px;transition:transform .4s cubic-bezier(.3,1.8,.5,1)}
nav button.on{color:#fff}nav button.on em{transform:translateY(-2px) scale(1.2)}
#ind{position:absolute;top:6px;bottom:6px;border-radius:20px;background:linear-gradient(135deg,var(--ac),var(--ac2));transition:left .5s cubic-bezier(.3,1.3,.5,1),width .5s}
.fab{position:absolute;bottom:92px;left:16px;width:56px;height:56px;border-radius:20px;background:linear-gradient(135deg,var(--ac),var(--ac2));color:#fff;font-size:28px;box-shadow:0 10px 24px rgba(155,28,28,.45);z-index:5;transition:transform .3s}
.fab:active{transform:scale(.9) rotate(90deg)}
.ov{position:absolute;inset:0;z-index:20;background:var(--bg);transform:translateX(calc(var(--in,-1)*100%));transition:transform .5s cubic-bezier(.2,.9,.25,1);display:flex;flex-direction:column}
.ov.on{transform:none}
.ch{display:flex;align-items:center;gap:10px;padding:12px 14px;border-bottom:1px solid var(--ln)}
.msgs{flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:8px}
.b{max-width:78%;padding:10px 14px;border-radius:20px;line-height:1.5;font-size:15px}
.b.me2{align-self:flex-start;background:linear-gradient(135deg,var(--ac),var(--ac2));color:#fff;border-end-start-radius:6px}
.b.th{align-self:flex-end;background:var(--card);box-shadow:var(--sh);border-end-end-radius:6px}
.in{display:flex;gap:8px;padding:10px 12px}.in input{flex:1;padding:12px 16px;border-radius:99px;border:1px solid var(--ln);background:var(--card);color:var(--tx);font:inherit}
.in button{width:46px;border-radius:50%;background:var(--ac);color:#fff}
.sheet{position:absolute;inset:auto 0 0;z-index:25;background:var(--card);border-radius:30px 30px 0 0;padding:20px;transform:translateY(105%);transition:transform .5s cubic-bezier(.2,.9,.25,1);box-shadow:0 -10px 40px rgba(0,0,0,.25)}
.sheet.on{transform:none}
.sheet textarea{width:100%;height:110px;border:0;background:var(--bg);color:var(--tx);border-radius:18px;padding:14px;font:inherit;resize:none;margin-bottom:12px}
.pub{width:100%;padding:13px;border-radius:18px;background:linear-gradient(135deg,var(--ac),var(--ac2));color:#fff;font-weight:600}
.toast{position:absolute;top:70px;left:50%;transform:translate(-50%,-120px);background:var(--tx);color:var(--bg);padding:10px 20px;border-radius:99px;z-index:40;transition:transform .5s cubic-bezier(.3,1.5,.5,1);font-size:14px}
.toast.on{transform:translate(-50%,0)}
.full{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;gap:12px;background:var(--bg);transition:opacity .6s,transform .7s cubic-bezier(.2,.9,.25,1)}
.full.hide{opacity:0;transform:scale(1.1);pointer-events:none}
#splash{z-index:60;background:radial-gradient(circle at 50% 40%,#2a0707,#000 70%);color:#fff}#auth{z-index:50}
.rg{position:absolute;width:260px;height:260px;border-radius:50%;border:2px solid var(--ac2);animation:rp 2.2s ease-out infinite}
@keyframes rp{from{transform:scale(.4);opacity:.9}to{transform:scale(1.7);opacity:0}}
.vlx{display:flex;direction:ltr;font-weight:800;font-size:100px;line-height:1;position:relative}.vlx.sm{font-size:58px}
.vlx span{display:inline-block;opacity:0;transform:translateY(50px) rotate(-10deg) scale(.4);animation:lt .9s cubic-bezier(.3,1.6,.5,1) forwards;background:linear-gradient(135deg,#3a3a3a,#4a0d0d);color:transparent;-webkit-background-clip:text;background-clip:text}
@keyframes lt{to{opacity:1;transform:none}}
.fi{width:100%;padding:14px 16px;border-radius:18px;border:1px solid var(--ln);background:var(--card);color:var(--tx);font:inherit}
.tabs{display:flex;background:var(--card);border-radius:18px;padding:4px;width:100%;box-shadow:var(--sh)}.tabs button{flex:1;padding:10px;border-radius:14px;transition:.3s}.tabs .on{background:linear-gradient(135deg,var(--ac),var(--ac2));color:#fff}
.lnk{color:var(--ac);font-size:14px;padding:8px}#af,#rf{width:100%;display:flex;flex-direction:column;gap:12px}
.wal{text-align:center;padding:20px;border-radius:26px;background:linear-gradient(135deg,var(--ac),var(--ac2));color:#fff;margin-bottom:8px}.wal b{display:block;font-size:34px}
.pb{flex:1;overflow-y:auto;padding:14px}
.ow{color:#8a8d94;font-size:.78em;font-weight:400;margin-inline-start:4px}
</style>

<!-- إعدادات قاعدة البيانات السحابية الحية للجميع -->
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
  import { getFirestore, collection, addDoc, onSnapshot, query, orderBy, doc, deleteDoc, updateDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyAx3fXwMsTvR2ihjl3ikVC5uVtw7ShKgXg",
    authDomain: "vlx-app-1f9be.firebaseapp.com",
    projectId: "vlx-app-1f9be",
    storageBucket: "vlx-app-1f9be.firebasestorage.app",
    messagingSenderId: "229072274587",
    appId: "1:229072274587:web:d0fe5f3be420a7202d723e",
    measurementId: "G-1NDLBRLY07"
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);

  // جلب المنشورات لكل الأجهزة بشكل فوري
  window.listenToCloudPosts = function(callback) {
    const q = query(collection(db, "posts"), orderBy("ts", "desc"));
    onSnapshot(q, (snapshot) => {
      const posts = [];
      snapshot.forEach((docSnap) => {
        posts.push({ id: docSnap.id, ...docSnap.data() });
      });
      callback(posts);
    });
  };

  // نشر منشور أو فيديو ليظهر للجميع أونلاين
  window.publishPostToCloud = async function(postData) {
    try {
      await addDoc(collection(db, "posts"), {
        u: postData.u || "أنت",
        t: postData.t || "",
        k: postData.k || "txt",
        mediaUrl: postData.mediaUrl || "",
        ts: Date.now(),
        lk: [],
        cm: [],
        pin: 0
      });
    } catch (e) {
      console.error("خطأ في النشر السحابي: ", e);
    }
  };

  window.deletePostFromCloud = async function(docId) {
    try {
      await deleteDoc(doc(db, "posts", docId));
    } catch (e) {}
  };

  window.updatePostInCloud = async function(docId, data) {
    try {
      await updateDoc(doc(db, "posts", docId), data);
    } catch (e) {}
  };
</script>

</head>
<body>
<div id="app">
<header><button class="hb" id="th" aria-label="الإعدادات">⚙️</button><div class="logo">VLX</div><button class="hb" id="wb" style="width:auto;padding:0 12px;font-size:13px" onclick="openStore()">🪙 0</button></header>
<main>
<section class="page on" id="p0"><div class="stories" id="stories"></div><div id="feed"></div></section>
<section class="page reels" id="p1"></section>
<section class="page" id="p2"><div style="display:flex;justify-content:space-between;align-items:center"><h2>الرسائل</h2><button class="join" onclick="openGroup()">＋ مجموعة</button></div><div id="chats"></div></section>
<section class="page" id="p3"><input class="search" id="sq" dir="ltr" placeholder="🔍 ابحث باليوزر @username"><div id="sres"></div><div class="chips" id="trend"></div></section>
<section class="page" id="p4"><div class="pcv" id="cov"></div><div class="pfb"><div class="pfh"><div class="avw"><div class="av" id="mav"></div><b class="plus">＋</b></div><div class="pfi"><h2 id="pn">أنت</h2><small id="pe"></small></div></div><div class="pfs"><div><b id="sg">0</b><small>يتابع</small></div><div><b id="sr">0</b><small>متابعون</small></div><div><b id="sl">0</b><small>إعجابات</small></div></div><button class="pub" onclick="openEdit()">تعديل الملف</button><div class="grid" id="grid"></div></div></section>
</main>
<button class="fab" id="fab">＋</button>
<nav id="nav"><i id="ind"></i></nav>

<div class="sheet" id="sheet">
  <textarea id="ta" placeholder="شنو يدور في بالك أو رابط الفيديو..."></textarea>
  <div class="hr">
    <label class="join" style="cursor:pointer">🎬 فيديو<input type="file" id="vf" accept="video/*" hidden></label>
    <label class="join" style="cursor:pointer">🖼 صورة<input type="file" id="imf" accept="image/*" hidden></label>
    <small id="vl"></small>
  </div>
  <button class="pub" id="pub">انشر للجميع</button>
</div>

<div class="full hide" id="auth"><div class="vlx sm"><span>V</span><span>L</span><span>X</span></div>
<div id="af"><div class="tabs"><button id="t1" class="on">دخول</button><button id="t2">حساب جديد</button></div><input class="fi" id="an" placeholder="الاسم" style="display:none"><input class="fi" id="au" placeholder="اليوزر (مثال: vlx_ali)" dir="ltr" style="display:none"><input class="fi" id="ae" type="email" placeholder="الإيميل" dir="ltr"><input class="fi" id="ap" type="password" placeholder="الباسورد" dir="ltr"><button class="pub" id="ab">دخول</button></div></div>
<div class="full" id="splash"><i class="rg"></i><div class="vlx"><span>V</span><span>L</span><span>X</span></div><div class="cl">كلان</div></div>
<div class="toast" id="toast"></div>
</div>

<script>
const $=s=>document.querySelector(s);
const T=[["🏠","الرئيسية"],["🎬","فيديو"],["💬","رسائل"],["🧭","اكتشف"],["👤","حسابي"]];
let cur=0, PO=[], DB={}, U=null, mode=0, pendingMedia="";
const pg=[...document.querySelectorAll(".page")];

function toast(t){const e=$("#toast");e.textContent=t;e.classList.add("on");setTimeout(()=>e.classList.remove("on"),1800)}
T.forEach((t,i)=>{const b=document.createElement("button");b.innerHTML=`<em>${t[0]}</em>${t[1]}`;b.onclick=()=>go(i);$("#nav").appendChild(b)});
function go(i){if(i==cur)return;const d=i>cur?1:-1,o=pg[cur],n=pg[i];o.classList.remove("on");o.classList.add("out");n.classList.remove("out");n.classList.add("on");cur=i;mark();$("#fab").style.display=i==0?"":"none"}
function mark(){const b=[...$("#nav").querySelectorAll("button")];b.forEach((x,i)=>x.classList.toggle("on",i==cur));$("#ind").style.left=b[cur].offsetLeft+"px";$("#ind").style.width=b[cur].offsetWidth+"px"}
setTimeout(mark,60);

$("#fab").onclick=()=>{$("#sheet").classList.toggle("on")};

try{DB=JSON.parse(localStorage.getItem("vlx_u")||"{}")}catch(e){}
const save=()=>localStorage.setItem("vlx_u",JSON.stringify(DB)), esc=s=>String(s||"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])), hs=s=>{let x=5381;for(const c of s)x=(x*33)^c.charCodeAt(0);return String(x>>>0)};

$("#t1").onclick=()=>{mode=0;$("#t1").classList.add("on");$("#t2").classList.remove("on");$("#an").style.display="none";$("#au").style.display="none"};
$("#t2").onclick=()=>{mode=1;$("#t2").classList.add("on");$("#t1").classList.remove("on");$("#an").style.display="";$("#au").style.display=""};

$("#ab").onclick=()=>{
  const e=$("#ae").value.trim().toLowerCase(), p=$("#ap").value;
  if(!e || p.length<6)return toast("أدخل إيميل صحيح وباسورد 6 أحرف على الأقل");
  if(mode){
    const u=$("#au").value.trim().toLowerCase().replace(/^@/,"");
    if(!u)return toast("أدخل يوزر صحيح");
    DB[e]={email:e, pass:hs(p), name:$("#an").value.trim()||u, u, coins:0, prem:0, fg:[], lk:[]};
    save();
  } else if(!DB[e]||DB[e].pass!==hs(p))return toast("خطأ بالإيميل أو الباسورد");
  U=DB[e]; localStorage.setItem("vlx_s",e);
  $("#auth").classList.add("hide");
  renderAll();
};

setTimeout(()=>{
  $("#splash").classList.add("hide");
  let s=localStorage.getItem("vlx_s");
  if(s && DB[s]){U=DB[s]; renderAll()} else {$("#auth").classList.remove("hide")}
},2000);

// رفع الصور والفيديوهات عبر رابط مؤقت أو كود Base64
$("#vf").onchange=e=>{
  const f=e.target.files[0]; if(!f)return;
  const r=new FileReader();
  r.onload=()=>{ pendingMedia=r.result; $("#vl").textContent="🎬 تم اختيار الفيديو"; };
  r.readAsDataURL(f);
};
$("#imf").onchange=e=>{
  const f=e.target.files[0]; if(!f)return;
  const r=new FileReader();
  r.onload=()=>{ pendingMedia=r.result; $("#vl").textContent="🖼 تم اختيار الصورة"; };
  r.readAsDataURL(f);
};

// النشر الفعلي الذي يظهر للجميع أونلاين
$("#pub").onclick=async()=>{
  const t=$("#ta").value.trim();
  if(!t && !pendingMedia)return toast("اكتب شيئاً أو أرفق ميديا");
  
  const postData = {
    u: U ? U.u : "عضو_VLX",
    t: t,
    k: pendingMedia.includes("data:video") ? "vid" : (pendingMedia ? "img" : "txt"),
    mediaUrl: pendingMedia,
    ts: Date.now(),
    lk: [],
    cm: []
  };

  if(window.publishPostToCloud) {
    await window.publishPostToCloud(postData);
  }

  $("#ta").value=""; pendingMedia=""; $("#vl").textContent="";
  $("#sheet").classList.remove("on");
  toast("تم النشر للجميع بنجاح!");
};

// سحب المنشورات الحية من سحاب الجميع بشكل تلقائي
if(window.listenToCloudPosts) {
  window.listenToCloudPosts((cloudPosts) => {
    PO = cloudPosts;
    renderAll();
  });
}

function renderFeed(){
  $("#feed").innerHTML = PO.map(p=>`
    <article class="card">
      <div class="ph">
        <div><b>@${esc(p.u)}</b><small>${new Date(p.ts).toLocaleTimeString()}</small></div>
      </div>
      ${p.t?`<div class="tx">${esc(p.t)}</div>`:""}
      ${p.mediaUrl?(p.k=="vid"?`<video src="${p.mediaUrl}" controls style="width:100%;max-height:300px"></video>`:`<img src="${p.mediaUrl}" style="width:100%;max-height:300px;object-fit:cover">`):""}
      <div class="ac">
        <button onclick="likePost('${p.id}')">❤️ <span>${(p.lk||[]).length}</span></button>
      </div>
    </article>
  `).join("") || "<div style='text-align:center;color:var(--mu);padding:40px'>لا توجد منشورات حالياً، كن أول من ينشر!</div>";
}

async function likePost(id){
  if(!U)return toast("سجل دخول أولاً للإعجاب");
  const p = PO.find(x=>x.id===id); if(!p)return;
  p.lk = p.lk || [];
  const idx = p.lk.indexOf(U.u);
  if(idx<0) p.lk.push(U.u); else p.lk.splice(idx,1);
  if(window.updatePostInCloud) await window.updatePostInCloud(id, {lk: p.lk});
  renderFeed();
}

function renderAll(){
  if(!U)return;
  $("#pn").textContent=U.name;
  $("#pe").textContent="@"+U.u;
  renderFeed();
}
</script>
</body>
</html>
