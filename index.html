<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
  import { getFirestore, collection, addDoc, onSnapshot, query, orderBy } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyAx3fXwMsTvR2ihjl3ikVC5uVtw7ShKgXg",
    authDomain: "vlx-app-1f9be.firebaseapp.com",
    projectId: "vlx-app-1f9be",
    storageBucket: "vlx-app-1f9be.firebasestorage.app",
    messagingSenderId: "229072274587",
    appId: "1:229072274587:web:d0fe5f3be420a7202d723e",
    measurementId: "G-1NDLBRLY07"
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);

  window.listenToCloudPosts = function(callback) {
    const q = query(collection(db, "posts"), orderBy("ts", "desc"));
    onSnapshot(q, (snapshot) => {
      const posts = [];
      snapshot.forEach((doc) => {
        posts.push({ id: doc.id, ...doc.data() });
      });
      callback(posts);
    });
  };

  window.publishPostToCloud = async function(postData) {
    try {
      await addDoc(collection(db, "posts"), {
        u: postData.u,
        t: postData.t,
        k: postData.k,
        ts: Date.now(),
        lk: [],
        cm: []
      });
    } catch (e) {
      console.error("خطأ بالنشر: ", e);
    }
  };
</script>
