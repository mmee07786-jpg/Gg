<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
  import { getFirestore, collection, addDoc, onSnapshot, query, orderBy, doc, deleteDoc, updateDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyAx3fXwMsTvR2ihjl3ikVC5uVtw7ShKgXg",
    authDomain: "vlx-app-1f9be.firebaseapp.com",
    projectId: "vlx-app-1f9be",
    storageBucket: "vlx-app-1f9be.firebasestorage.app",
    messagingSenderId: "229072274587",
    appId: "1:229072274587:web:d0fe5f3be420a7202d723e",
    measurementId: "G-1NDLBRLY07"
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);

  window.listenToCloudPosts = function(callback) {
    const q = query(collection(db, "posts"), orderBy("ts", "desc"));
    onSnapshot(q, (snapshot) => {
      const posts = [];
      snapshot.forEach((docSnap) => {
        posts.push({ id: docSnap.id, ...docSnap.data() });
      });
      callback(posts);
    });
  };

  window.publishPostToCloud = async function(postData) {
    try {
      await addDoc(collection(db, "posts"), {
        u: postData.u || "أنت",
        t: postData.t || "",
        k: postData.k || "txt",
        ts: Date.now(),
        lk: [],
        cm: [],
        pin: 0,
        vw: 0
      });
    } catch (e) {
      console.error("خطأ بالنشر: ", e);
    }
  };

  window.deletePostFromCloud = async function(docId) {
    try {
      await deleteDoc(doc(db, "posts", docId));
    } catch (e) {
      console.error("خطأ بالحذف: ", e);
    }
  };

  window.updatePostInCloud = async function(docId, data) {
    try {
      await updateDoc(doc(db, "posts", docId), data);
    } catch (e) {
      console.error("خطأ بالتحديث: ", e);
    }
  };
</script>

/* النشر مع السيرفر */
async function commit(){
  const v=$("#ta").value.trim();
  const id="p"+Date.now().toString(36)+Math.random().toString(36).slice(2,5);
  const postObj = {id, u: (U?U.u:"أنت"), t: v, k: "txt", ts: Date.now(), lk: [], cm: [], pin: 0};
  
  if(window.publishPostToCloud) {
    await window.publishPostToCloud(postObj);
  }
  
  PO.unshift(postObj);
  savePO();
  $("#ta").value="";
  $("#ta").oninput();
  $("#sheet").classList.remove("on");
  renderAll();
  toast("تم النشر بنجاح!");
}

$("#pub").onclick=()=>{
  const v=$("#ta").value.trim();
  if(!v) return toast("اكتب شيء حتى تنشر");

/* بطاقات المنشورات الكاملة والتفاعلية */
const fmt=t=>esc(t).replace(/#([\p{L}\p{N}_]+)/gu,"<span class=\"tg\" onclick=\"tagS('$1')\">#$1</span>");

function pcard(p, full) {
  const userAcc = UA(p.u) || { name: p.u || "عضو VLX", col: "#4e5058" };
  const isMe = U && p.u === U.u;
  const isLiked = U && p.lk && p.lk.includes(U.u);
  
  return `
  <article class="card" data-p="${p.id}">
    <div class="ph">
      <div onclick="openProf('${p.u}')" style="display:flex;gap:10px;align-items:center;flex:1">
        ${avh(userAcc)}
        <div>
          <b>${esc(userAcc.name)}${p.u===OWN?ownTag:""}</b>
          <small style="display:block"><bdi>@${esc(p.u||"user")}</bdi> · ${ago(p.ts || Date.now())}</small>
        </div>
      </div>
      ${isMe ? `<button class="hb" style="width:auto;padding:0 10px;font-size:13px" onclick="pinP('${p.id}')">${p.pin ? "📌✓" : "📌"}</button>` : ""}
      ${(isMe || (U && U.u === OWN)) ? `<button class="hb" style="width:auto;padding:0 12px;font-size:12px" onclick="delP('${p.id}')">${isMe ? "🗑" : "🛡 حذف"}</button>` : ""}
    </div>
    
    ${p.t ? `<div class="tx">${fmt(p.t)}</div>` : ""}
    
    <div class="ac">
      <button data-lk="${p.id}" class="${isLiked ? "liked" : ""}" onclick="lkp('${p.id}')">
        <span>${isLiked ? "❤️" : "🤍"}</span>
        <i style="font-style:normal">${(p.lk || []).length}</i>
      </button>
      <button onclick="cmt('${p.id}')">
        <span>💬</span>
        <i style="font-style:normal" data-cc="${p.id}">${(p.cm || []).length}</i>
      </button>
      <button onclick="cpL('${p.id}')">🔗</button>
    </div>
    
    <div data-cm="${p.id}">
      ${full || OPEN.has(p.id) ? cmh(p) : ""}
    </div>
  </article>`;
}

function cmh(p) {
  return `<div style="padding:0 14px 12px">
    ${(p.cm || []).map(c => `
      <div style="padding:6px 0;font-size:14px">
        <b><bdi>@${esc(c.u)}</bdi></b> ${esc(c.t)} 
        <small style="color:var(--mu)">${ago(c.ts)}</small>
        ${(U && (c.u === U.u || p.u === U.u || U.u === OWN)) ? ` <button onclick="dc('${p.id}',${c.ts})" style="color:var(--mu);font-size:12px">✕</button>` : ""}
      </div>
    `).join("")}
    <div style="display:flex;gap:8px;margin-top:6px">
      <input class="fi" placeholder="اكتب تعليقاً…" style="padding:10px 14px;border-radius:99px" onkeydown="if(event.key=='Enter')addC('${p.id}',this)">
      <button class="join" onclick="addC('${p.id}',this)">➤</button>
    </div>
  </div>`;
}

/* الإعجاب بالم المنشورات وتحديث Firebase */
function lkp(id) {
  if(!U) return toast("سجل دخول أولاً");
  const p = PO.find(x => x.id === id);
  if (!p) return;
  p.lk = p.lk || [];
  const i = p.lk.indexOf(U.u);
  if (i < 0) p.lk.push(U.u);
  else p.lk.splice(i, 1);
  
  if(window.updatePostInCloud) {
    window.updatePostInCloud(id, { lk: p.lk });
  }
  savePO();
  renderAll();
}

/* التعليقات */
function cmt(id) {
  if (OPEN.has(id)) OPEN.delete(id);
  else OPEN.add(id);
  document.querySelectorAll(`[data-cm="${id}"]`).forEach(e => {
    const p = PO.find(x => x.id === id);
    if(p) e.innerHTML = OPEN.has(id) ? cmh(p) : "";
  });
}

function addC(id, el) {
  if(!U) return toast("سجل دخول لتعلق");
  const p = PO.find(x => x.id === id);
  const inputEl = el.closest("[data-cm]").querySelector("input");
  const v = inputEl.value.trim();
  if (!v) return;
  p.cm = p.cm || [];
  p.cm.push({ u: U.u, t: v, ts: Date.now() });
  
  if(window.updatePostInCloud) {
    window.updatePostInCloud(id, { cm: p.cm });
  }
  savePO();
  OPEN.add(id);
  renderAll();
}

function dc(id, ts) {
  const p = PO.find(x => x.id === id);
  if (!p) return;
  p.cm = (p.cm || []).filter(c => c.ts !== ts);
  if(window.updatePostInCloud) {
    window.updatePostInCloud(id, { cm: p.cm });
  }
  savePO();
  renderAll();
}

/* حذف المنشور */
function delP(id) {
  if (DELQ !== id) {
    DELQ = id;
    setTimeout(() => DELQ = "", 3000);
    return toast("اضغط حذف مرة ثانية للتأكيد");
  }
  if(window.deletePostFromCloud) {
    window.deletePostFromCloud(id);
  }
  PO = PO.filter(x => x.id !== id);
  savePO();
  renderAll();
  toast("تم الحذف بنجاح");
}

/* تثبيت المنشور */
function pinP(id) {
  const p = PO.find(x => x.id === id);
  if (!p) return;
  p.pin = p.pin ? 0 : Date.now();
  if(window.updatePostInCloud) {
    window.updatePostInCloud(id, { pin: p.pin });
  }
  savePO();
  renderAll();
  toast(p.pin ? "تم تثبيت المنشور 📌" : "تم إلغاء التثبيت");
}

function cpL(id) {
  const l = "vlx://p/" + id;
  try {
    navigator.clipboard.writeText(l).then(() => toast("تم نسخ رابط المنشور"));
  } catch(e) {
    toast("الرابط: " + l);
  }
}

function renderFeed() {
  $("#feed").innerHTML = PO.map(p => pcard(p)).join("") || "<div style='text-align:center;color:var(--mu);padding:50px 20px'>ما في منشورات بعد<br>اضغط ＋ وانشر أول منشور</div>";
}

function renderGrid() {
  if(!U) return;
  const myPosts = PO.filter(p => p.u === U.u);
  $("#grid").innerHTML = myPosts.map(p => `
    <div onclick="openPost('${p.id}')" style="background:var(--card);padding:10px;border-radius:12px;overflow:hidden">
      <small>${esc(p.t.slice(0, 50))}</small>
    </div>
  `).join("") || "<small style='grid-column:1/-1;text-align:center;color:var(--mu);padding:20px'>منشوراتك تظهر هنا</small>";
}

function renderAll() {
  renderFeed();
  renderGrid();
}
